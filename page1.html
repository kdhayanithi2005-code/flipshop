<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
</head>
<body>
    <center>
        <h1>FLIP Shop</h1>
    <form action="./login.py" method="post">
        <table>
            <tr>
                <td>First Name:</td>
                <td><input type="text" name="username"></td>
            </tr>
            <tr>
                <td> Last Name:</td>
                <td><input type="text" name="userlname"></td>
            </tr>
            <tr>
                <td>Mobile No:</td>
                <td><input type="tel"name="mob" minlength="10" maxlength="10"></td>
            </tr>
            <tr>
                <td>Gmail i'd:</td>
                <td><input type="text"name="id"></td>
            </tr>
            <tr>
                <td>Date Of Birth:</td>
                <td><input type="date"name="dob"></td>
            </tr>
            <tr>
                <td>Age:</td>
                <td><input type="number"name="ag"></td>
            </tr>
            <tr>
                <td>GENDER:</td>
                <td>:<input type="radio"name="gender"value="male"/>male
                     <input type="radio"name="gender"value="female"/>female<br/><br/></td>
            </tr>
            <tr>
                <td>BloodGroup:</td>
                <td><input type="text"name="bgroup"></td>
            </tr>
            <tr>
                <td>PANCARD:</td>
                <td><input type="text" name="panca"></td>
            </tr>
            <tr>
                <td>Address:</td>
                <td><input type="text"name="add"></td>
            </tr>
            <tr>
                <td>Pin Code:</td>
                <td><input type="text" name="pin"></td>
            </tr>           
            <tr>
                <td>District:</td>
                <td><input type="text" name="dis"></td>
            </tr>           
            
        </table>
        <button type="submit">LOGIN</button></td>
       <button type="reset">Clear</button>
       </center>
    </form>

</body>
</html>
